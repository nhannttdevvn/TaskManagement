{% extends "base.html" %}

{% block title %}Delete Task | TMDS{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Delete Task</h1>
<p>Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Delete</button>
  <a class="btn btn-link" href="{% url 'task_detail' task.pk %}">Cancel</a>
</form>
{% endblock %}
