<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TMDS{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 20px;
        padding-bottom: 20px;
      }
      .task-done {
        text-decoration: line-through;
        color: #6c757d;
      }
      .task-in-progress {
        font-weight: bold;
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="mb-4">
        <nav class="navbar navbar-expand-lg navbar-light bg-light rounded">
          <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'task_list' %}">TMDS</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'task_list' %}">Tasks</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'task_create' %}"
                    >New Task</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
      <main>{% block content %}{% endblock %}</main>
      <footer class="mt-4 pt-3 border-top text-center text-muted">
        <p>&copy; 2025 TMDS</p>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
